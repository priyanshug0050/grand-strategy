<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market — Grand Strategy</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/mobile.css">
</head>
<body>

<header class="topbar">
  <span class="brand">Grand Strategy</span>
  <div class="clock" id="clock">
    <span class="turn" id="clockTurn">Turn —</span>
    <span class="until" id="clockUntil"></span>
  </div>
  <nav>
    <a href="/dashboard.html">Situation</a>
    <a href="/cities.html">Cities</a>
    <a href="/economy.html">Economy</a>
    <a href="/policy.html">Policy</a>
    <a href="/market.html" aria-current="page">Market</a>
    <a href="/military.html">Military</a>
    <a href="#" id="signOut">Sign out</a>
  </nav>
</header>

<main class="wrap">

  <div style="display:flex; align-items:baseline; gap:1rem; margin-bottom:1.2rem;">
    <div>
      <p class="eyebrow">Exchange</p>
      <h1>Market</h1>
    </div>
    <span class="eyebrow" id="treasuryLine" style="margin-left:auto"></span>
  </div>

  <div id="msg" class="msg hidden"></div>

  <!-- Ticker: what everything is doing right now, at a glance -->
  <div class="ticker" id="ticker"></div>

  <!-- Every resource at a glance: what it trades for, what you hold -->
  <section class="panel" style="margin-bottom:var(--gap-l)">
    <header><h2>All resources</h2><span class="eyebrow">bid / ask · your holdings</span></header>
    <div class="body"><div id="overview"></div></div>
  </section>

  <div class="grid two">

    <div style="display:grid; gap:var(--gap-l)">

      <section class="panel">
        <header>
          <h2 id="chartTitle">Price</h2>
          <span class="eyebrow" id="chartStats"></span>
        </header>
        <div class="body">
          <div id="chart"></div>
        </div>
      </section>

      <section class="panel">
        <header>
          <h2 id="bookTitle">Order book</h2>
          <span class="eyebrow" id="spreadLine"></span>
        </header>
        <div class="body">
          <div class="book" id="book"></div>
        </div>
      </section>

      <section class="panel">
        <header><h2>Recent trades</h2></header>
        <div class="body"><div id="trades"></div></div>
      </section>

    </div>

    <div style="display:grid; gap:var(--gap-l)">

      <section class="panel">
        <header><h2>Place an order</h2></header>
        <div class="body">
          <div class="sidetoggle">
            <button id="sideBuy" class="active">Buy</button>
            <button id="sideSell">Sell</button>
          </div>

          <div class="field" style="margin-top:.9rem">
            <label for="orderResource">Resource</label>
            <select id="orderResource"></select>
          </div>
          <div class="row-controls">
            <div class="field">
              <label for="orderPrice">Price each</label>
              <input id="orderPrice" type="number" min="1" step="1">
            </div>
            <div class="field">
              <label for="orderQty">Quantity</label>
              <input id="orderQty" type="number" min="1" step="1" value="10">
            </div>
          </div>

          <!-- Cost and consequence before committing, same as everywhere else -->
          <div class="ledger" id="orderPreview">
            <div class="row"><span class="k">enter a price and quantity</span><span class="v">—</span></div>
          </div>

          <button id="placeBtn" class="primary" style="width:100%; margin-top:.8rem">Place order</button>
        </div>
      </section>

      <section class="panel">
        <header><h2>Your open orders</h2><span class="eyebrow" id="myOrderCount"></span></header>
        <div class="body"><div id="myOrders"></div></div>
      </section>

    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/market.js"></script>
</body>
</html>
